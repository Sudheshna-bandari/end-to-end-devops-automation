
name: Book Review CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Build Docker image
        run: docker build -t book-review-app:${{ github.sha }} .

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build -t book-review-app:${{ github.sha }} .

      - name: Deploy to Kubernetes
        run: kubectl set image deployment/book-review book-review=book-review-app:${{ github.sha }}

      - name: Verify deployment
        run: kubectl rollout status deployment/book-review --timeout=180s
