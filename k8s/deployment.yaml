
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-review
  template:
    metadata:
      labels:
        app: book-review
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: book-review
          image: book-review-app:monitoring
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: book-review-service
spec:
  type: NodePort
  selector:
    app: book-review
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
